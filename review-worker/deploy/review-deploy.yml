name: review-deploy
# STAGE 1 (inactive draft until approved). Deploys the private review Worker. Run by hand only.
# Needs: CLOUDFLARE_API_TOKEN with "Account · D1 · Edit" added (plus the Workers permissions it already has),
#        repository secrets REVIEW_ACCESS_TEAM_DOMAIN, REVIEW_ACCESS_AUD, REVIEW_OWNER_EMAIL,
#        and the two D1 database ids written into review-worker/wrangler.jsonc (ids are not secret).
# Nothing private is printed: wrangler shows names and ids only, and the Worker settings are passed as secrets.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets exist (names only)
        env:
          A: ${{ secrets.REVIEW_ACCESS_TEAM_DOMAIN }}
          B: ${{ secrets.REVIEW_ACCESS_AUD }}
          C: ${{ secrets.REVIEW_OWNER_EMAIL }}
        run: |
          for v in A B C; do test -n "${!v}" || { echo "::error::A REVIEW_* secret is missing (docs/45 stage 1)."; exit 1; }; done
          grep -q '00000000-0000-0000-0000-00000000000' review-worker/wrangler.jsonc && { echo "::error::Put the real D1 database ids in review-worker/wrangler.jsonc first."; exit 1; } || true
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Unit tests (auth, engine parity is skipped without local data)
        working-directory: review-worker
        run: node --test test/auth.test.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          workingDirectory: review-worker
          command: d1 migrations apply jbp_private --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          workingDirectory: review-worker
          command: d1 migrations apply jbp_backup --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          workingDirectory: review-worker
          secrets: |
            ACCESS_TEAM_DOMAIN
            ACCESS_AUD
            OWNER_EMAIL
          command: deploy
        env:
          ACCESS_TEAM_DOMAIN: ${{ secrets.REVIEW_ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.REVIEW_ACCESS_AUD }}
          OWNER_EMAIL: ${{ secrets.REVIEW_OWNER_EMAIL }}
      - name: Smoke test (no credentials, so it must be refused)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://review.jaysbracketplays.com/api/state)
          echo "Unauthenticated request got HTTP $code (expected a redirect to the Access login, or 403)"
          case "$code" in 302|303|401|403) ;; *) echo "::error::The review page answered without a login (HTTP $code). Check the Access application."; exit 1;; esac
