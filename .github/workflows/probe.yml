name: source-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="bracketology-bot/0.1 (free open bracketology project)"
          for u in "https://barttorvik.com/2027_team_results.csv" "https://barttorvik.com/getgamestats.php?year=2027&csv=1" "https://ncaa-api.henrygd.me/rankings/basketball-men/d1/ncaa-mens-basketball-net-rankings" "https://ncaa-api.henrygd.me/scoreboard/basketball-men/d1/2026/11/04/all-conf" "https://www.warrennolan.com/basketball/2027/compare-rankings" "https://www.warrennolan.com/basketball/2027/scores?date=2026-11-04" "https://www.warrennolan.com/basketball/2027/autobids" "http://bracketmatrix.com/"; do
            curl -s -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download} $u\n" "$u"; sleep 11
          done
