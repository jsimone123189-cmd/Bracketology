name: daily-update
on:
  schedule: [{cron: "17 10 * 11-12,1-4 *"}]   # daily 10:17 UTC, Nov-Apr (season)
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pytest
      - run: PYTHONPATH=src pytest -q
      - run: PYTHONPATH=src python -m bracketology.pipeline
        env: {BRACKETOLOGY_UA: "bracketology-bot/0.1 (see repo README for contact)"}
      # Persistence + D1 publish added in the deployment stage.
