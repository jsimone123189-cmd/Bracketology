name: review-upload-once
# STAGE 2 (approved 2026-11-15). Run by hand only. Builds today's review in Actions and uploads it to the private Worker, once.
# Needs repository secrets REVIEW_URL, CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET (the Access service token).
# Logs show only file names and the upload status ({"stored": true, ...}); the review itself is never printed or kept as an artifact.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.9"}
      - run: pip install requests numpy==2.0.2 scipy scikit-learn==1.6.1 joblib
      - name: Restore saved game results
        run: |
          git fetch origin snapshots:snapshots || true
          mkdir -p data/output/gamecache; git show snapshots:gamecache/2027.json > data/output/gamecache/2027.json || true
      - run: PYTHONPATH=src python -m bracketology.review build 2027 > /dev/null && echo "review built"
        env: {BRACKETOLOGY_UA: "bracketology-bot/0.1 (free open bracketology project)"}
      - run: PYTHONPATH=src python -m bracketology.review upload 2027
        env:
          REVIEW_URL: ${{ secrets.REVIEW_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
